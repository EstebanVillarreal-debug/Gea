<!DOCTYPE html>
<html lang="es">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="img/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        azuoscuro: '#16324f',
                        azu: '#1f6fb2',
                        aguama: '#2ca58d',
                        orro: '#c98b2f',
                        hue: '#f4f8fb',
                        blan: '#ffffff',
                        text: '#16232f',
                        sua: '#55677a',
                        borde: '#e1e9f0'

                    fontFamily: {
                        display: ['Poppins', 'Segoe UI', 'sans-serif'],
                        texto: ['Inter', 'Segoe UI', 'sans-serif'],
                        titulo: ['Georgia', 'Times New Roman', 'serif']

    <title>Gea</title>

<body
    class="bg-hue m-0 p-0 font-texto text-text flex flex-col items-center justify-start text-center min-h-screen overflow-x-hidden">

    <header class="w-full">
        <section class="pagina_gea flex min-h-screen w-full items-center justify-center bg-[#f4f8fb]"">
            <div class="homeadmin flex min-h-screen w-full flex-col items-center px-4 py-8">
                <!-- Header -->
                <header
                    class="header mb-[18px] flex w-[min(95vw,520px)] items-center justify-between rounded-[40px] bg-[#f5c6d0] px-5 py-3 shadow-[0_4px_12px_rgba(0,0,0,.08)] max-[480px]:rounded-[30px] max-[480px]:px-[14px] max-[480px]:py-[10px]">
                    <div class="perfil">

                            class="grid size-[70px] place-items-center rounded-full border-[3px] border-[#6b4c9a] bg-white text-3xl text-[#6b4c9a] max-[480px]:size-[55px]">
                            <i class="fa-solid fa-user"></i>
                        </div>
                    </div>
                    <div class="escudo">
                        <img src="img/escudo.png" alt="Escudo" class="h-auto w-[70px] max-[480px]:w-[55px]">
                    </div>
                </header>

                <!-- Bienvenida y fecha -->
                <div
                    class="bienvenida mb-[6px] flex w-[min(95vw,520px)] justify-between px-2 text-[.95rem] text-[#333] max-[480px]:text-[.85rem]">
                    <span>Bienvenido Jose Perez</span>
                    <span id="fecha">Fecha: --/--/----</span>
                </div>

                <!-- Menú de opciones -->
                <main class="menu flex w-[min(95vw,420px)] flex-col items-center justify-center gap-[18px]">

                    <div class="fila flex justify-center gap-[18px] max-[480px]:gap-[10px]">
                        <a href="#"
                            class="tarjeta amarillo flex h-[90px] w-[150px] items-center justify-between rounded-2xl bg-[#f9e79f] px-[18px] text-[1.05rem] font-bold text-[#222] no-underline shadow-[0_4px_10px_rgba(0,0,0,.12)] transition hover:-translate-y-1 hover:shadow-[0_8px_18px_rgba(0,0,0,.15)] max-[480px]:h-20 max-[480px]:w-[135px] max-[480px]:px-[14px] max-[480px]:text-[.95rem]">
                            <span>Noticias</span>
                            <span class="icono text-[1.8rem] max-[480px]:text-2xl">📄</span>
                        </a>
                        <a href="#"
                            class="tarjeta verde flex h-[90px] w-[150px] items-center justify-between rounded-2xl bg-[#a9dfbf] px-[18px] text-[1.05rem] font-bold text-[#222] no-underline shadow-[0_4px_10px_rgba(0,0,0,.12)] transition hover:-translate-y-1 hover:shadow-[0_8px_18px_rgba(0,0,0,.15)] max-[480px]:h-20 max-[480px]:w-[135px] max-[480px]:px-[14px] max-[480px]:text-[.95rem]">
                            <span>Registro</span>
                            <span class="icono text-[1.8rem] max-[480px]:text-2xl">📋</span>
                        </a>
                    </div>

                    <div class="fila flex justify-center gap-[18px] max-[480px]:gap-[10px]">
                        <a href="#"
                            class="tarjeta rojo flex h-[90px] w-[150px] items-center justify-between rounded-2xl bg-[#f5b7b1] px-[18px] text-[1.05rem] font-bold text-[#222] no-underline shadow-[0_4px_10px_rgba(0,0,0,.12)] transition hover:-translate-y-1 hover:shadow-[0_8px_18px_rgba(0,0,0,.15)] max-[480px]:h-20 max-[480px]:w-[135px] max-[480px]:px-[14px] max-[480px]:text-[.95rem]">
                            <span>Reportes</span>
                            <span class="icono text-[1.8rem] max-[480px]:text-2xl">📝</span>
                        </a>
                        <a href="#" id="abrir-docentes"
                            class="tarjeta morado flex h-[90px] w-[150px] items-center justify-between rounded-2xl bg-[#d2b4de] px-[18px] text-[1.05rem] font-bold text-[#222] no-underline shadow-[0_4px_10px_rgba(0,0,0,.12)] transition hover:-translate-y-1 hover:shadow-[0_8px_18px_rgba(0,0,0,.15)] max-[480px]:h-20 max-[480px]:w-[135px] max-[480px]:px-[14px] max-[480px]:text-[.95rem]">
                            <span>Docentes</span>
                            <span class="icono text-[1.8rem] max-[480px]:text-2xl">👥</span>
                        </a>
                    </div>

                    <div class="fila centro flex justify-center gap-[18px] max-[480px]:gap-[10px]">
                        <a href="#"

                            <span>Calendario</span>
                            <span class="icono text-[1.8rem] max-[480px]:text-2xl">📅</span>
                        </a>
                    </div>
                </main>
            </div>
        </section>

        <!-- Módulo de docentes -->

                </button>
                <button type="button" aria-label="Registro"
                    class="nav-icono grid size-[46px] place-items-center rounded-xl border-0 bg-transparent p-0 text-[19px] text-white/55 shadow-none transition hover:bg-white/10 hover:text-white max-[560px]:size-10">
                    <i class="fa-solid fa-clipboard-list"></i>
                </button>
                <button type="button" aria-label="Reportes"
                    class="nav-icono grid size-[46px] place-items-center rounded-xl border-0 bg-transparent p-0 text-[19px] text-white/55 shadow-none transition hover:bg-white/10 hover:text-white max-[560px]:size-10">

                <button type="button" aria-label="Docentes"

                    <i class="fa-solid fa-users"></i>
                </button>
                <button type="button" aria-label="Calendario"

                    <i class="fa-solid fa-calendar-days"></i>
                </button>
                <button type="button" aria-label="Perfil"
                    class="nav-icono grid size-[46px] place-items-center rounded-xl border-0 bg-transparent p-0 text-[19px] text-white/55 shadow-none transition hover:bg-white/10 hover:text-white max-[560px]:size-10">
                    <i class="fa-solid fa-circle-user"></i>
                </button>
            </aside>

            <main

                <section aria-label="Opciones de docentes"

                    <h1

                            <span>Docentes</span>

                        </button>

                            <span>Horario</span>
                            <i aria-hidden="true" class="fa-solid fa-user-clock text-[28px] text-[#b91661]"></i>
                        </button>
                    </div>

                        Docentes</h1>
                    <div aria-hidden="true" hidden class="docentes-linea"></div>

                    <nav aria-label="Opciones de docentes"

                        <button type="button" data-vista-docente="lista"
                            class="pestana-docente activa h-auto flex-1 whitespace-nowrap rounded-full border-0 bg-transparent px-3 py-[6px] text-[14.5px] font-semibold text-[#55677a] transition hover:bg-[#f4f8fb] hover:text-[#16324f] [&.activa]:bg-gradient-to-br [&.activa]:from-[#6b4c9a] [&.activa]:to-[#8b318b] [&.activa]:text-white [&.activa]:shadow-[0_6px_14px_-6px_rgba(119,31,178,.5)]">Docentes</button>
                        <button type="button" data-vista-docente="agregar"
                            class="pestana-docente h-auto flex-1 whitespace-nowrap rounded-full border-0 bg-transparent px-3 py-[6px] text-[14.5px] font-semibold text-[#55677a] transition hover:bg-[#f4f8fb] hover:text-[#16324f] [&.activa]:bg-gradient-to-br [&.activa]:from-[#6b4c9a] [&.activa]:to-[#8b318b] [&.activa]:text-white [&.activa]:shadow-[0_6px_14px_-6px_rgba(119,31,178,.5)]">Agregar
                            Docente</button>
                        <button type="button" data-vista-docente="rango"
                            class="pestana-docente h-auto flex-1 whitespace-nowrap rounded-full border-0 bg-transparent px-3 py-[6px] text-[14.5px] font-semibold text-[#55677a] transition hover:bg-[#f4f8fb] hover:text-[#16324f] [&.activa]:bg-gradient-to-br [&.activa]:from-[#6b4c9a] [&.activa]:to-[#8b318b] [&.activa]:text-white [&.activa]:shadow-[0_6px_14px_-6px_rgba(119,31,178,.5)]">Cambiar
                            Rango</button>
                    </nav>

                                </button>

                                    class="menu-filtros absolute right-0 top-[52px] z-20 hidden w-[170px] flex-col gap-2 rounded-[18px] border-2 border-[#222] bg-[#8163ad] p-3 shadow-[0_8px_20px_rgba(0,0,0,.15)] [&.visible]:flex">
                                    <button type="button" data-filtro="todos"

                                            <button type="button" data-grado="603"
                                                class="opcion-grado-aula my-1 flex min-h-[38px] w-full items-center justify-center self-center rounded-[7px] border border-[#222] bg-[#f1f1f1] px-[10px] py-[6px] text-center font-serif text-[15px] font-bold text-[#222] hover:bg-[#a846a8] hover:text-white">603</button>

                                            <button type="button" data-grado="702"

                                            <button type="button" data-grado="703"

                                            <button type="button" data-grado="801"

                                            <button type="button" data-grado="902"
