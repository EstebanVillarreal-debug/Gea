<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../img/favicon.png">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        azuoscuro: '#16324f',
                        azu: '#1f6fb2',
                        aguama: '#2ca58d',
                        orro: '#c98b2f',
                        hue: '#f4f8fb',
                        blan: '#ffffff',
                        text: '#16232f',
                        sua: '#55677a',
                        borde: '#e1e9f0'
                    },
                    fontFamily: {
                        display: ['Poppins', 'Segoe UI', 'sans-serif'],
                        texto: ['Inter', 'Segoe UI', 'sans-serif'],
                        titulo: ['Georgia', 'Times New Roman', 'serif']
                    }
                }
            }
        };
    </script>
    <title>GEA | Registro</title>
</head>

<body class="m-0 min-h-screen overflow-x-hidden bg-hue p-0 font-texto text-text">

    <!-- BARRA LATERAL -->
    <aside aria-label="Navegación principal"
        class="fixed inset-y-0 left-0 z-30 flex w-[76px] flex-col items-center gap-2 bg-gradient-to-b from-azuoscuro to-[#0e2036] py-5 max-[640px]:top-auto max-[640px]:bottom-4 max-[640px]:left-1/2 max-[640px]:h-[66px] max-[640px]:w-[min(calc(100%-32px),420px)] max-[640px]:-translate-x-1/2 max-[640px]:flex-row max-[640px]:justify-around max-[640px]:gap-0 max-[640px]:rounded-full max-[640px]:px-3 max-[640px]:py-0 max-[640px]:shadow-[0_16px_40px_rgba(14,32,54,0.45)] max-[640px]:ring-1 max-[640px]:ring-white/10">

        <img src="../img/escudo.png" alt="Escudo del colegio" class="mb-3 h-10 w-auto max-[640px]:hidden">

        <a href="../admin/principal.html" aria-label="Noticias"
            class="group relative grid size-[46px] place-items-center rounded-xl text-[19px] text-white/55 transition hover:bg-white/10 hover:text-white max-[640px]:rounded-full">
            <i class="fa-solid fa-newspaper"></i>
            <span class="pointer-events-none absolute left-[calc(100%+12px)] top-1/2 -translate-y-1/2 whitespace-nowrap rounded-md bg-azuoscuro px-2.5 py-1 text-xs font-medium text-white opacity-0 shadow-lg transition-opacity group-hover:opacity-100 max-[640px]:hidden">Noticias</span></a>

        <!-- activo -->
        <a href="../admin/modulo-registros.html" aria-label="Registro" aria-current="page"
            class="group relative grid size-[46px] place-items-center rounded-xl bg-gradient-to-br from-aguama to-azu text-[19px] text-white shadow-[0_6px_16px_-6px_rgba(44,165,141,.55)] max-[640px]:rounded-full">
            <i class="fa-solid fa-clipboard-list"></i>
            <span class="pointer-events-none absolute left-[calc(100%+12px)] top-1/2 -translate-y-1/2 whitespace-nowrap rounded-md bg-azuoscuro px-2.5 py-1 text-xs font-medium text-white opacity-0 shadow-lg transition-opacity group-hover:opacity-100 max-[640px]:hidden">Registro</span></a>

        <a href="../admin/modulo-reportes.html" aria-label="Reportes"
            class="group relative grid size-[46px] place-items-center rounded-xl text-[19px] text-white/55 transition hover:bg-white/10 hover:text-white max-[640px]:rounded-full">
            <i class="fa-solid fa-file-lines"></i>
            <span class="pointer-events-none absolute left-[calc(100%+12px)] top-1/2 -translate-y-1/2 whitespace-nowrap rounded-md bg-azuoscuro px-2.5 py-1 text-xs font-medium text-white opacity-0 shadow-lg transition-opacity group-hover:opacity-100 max-[640px]:hidden">Reportes</span></a>

        <a href="../admin/modulo-docentes.html" aria-label="Docentes"
            class="group relative grid size-[46px] place-items-center rounded-xl text-[19px] text-white/55 transition hover:bg-white/10 hover:text-white max-[640px]:rounded-full">
            <i class="fa-solid fa-chalkboard-user"></i>
            <span class="pointer-events-none absolute left-[calc(100%+12px)] top-1/2 -translate-y-1/2 whitespace-nowrap rounded-md bg-azuoscuro px-2.5 py-1 text-xs font-medium text-white opacity-0 shadow-lg transition-opacity group-hover:opacity-100 max-[640px]:hidden">Docentes</span></a>

        <a href="../admin/modulo-calendario.html" aria-label="Calendario"
            class="group relative grid size-[46px] place-items-center rounded-xl text-[19px] text-white/55 transition hover:bg-white/10 hover:text-white max-[640px]:rounded-full">
            <i class="fa-regular fa-calendar-days"></i>
            <span class="pointer-events-none absolute left-[calc(100%+12px)] top-1/2 -translate-y-1/2 whitespace-nowrap rounded-md bg-azuoscuro px-2.5 py-1 text-xs font-medium text-white opacity-0 shadow-lg transition-opacity group-hover:opacity-100 max-[640px]:hidden">Calendario</span></a>

        <a href="../admin/modulo-perfil.html" aria-label="Mi perfil"
            class="group relative mt-auto block size-[52px] shrink-0 max-[640px]:mt-0">
            <img data-perfil-foto src="../img/usuario.png" alt="Foto de perfil"
                class="absolute inset-[8%] h-[84%] w-[84%] rounded-full bg-hue object-cover">
            <img src="../img/alrededor.png" alt=""
                class="pointer-events-none absolute inset-0 h-full w-full object-contain">
            <span class="pointer-events-none absolute left-[calc(100%+12px)] top-1/2 -translate-y-1/2 whitespace-nowrap rounded-md bg-azuoscuro px-2.5 py-1 text-xs font-medium text-white opacity-0 shadow-lg transition-opacity group-hover:opacity-100 max-[640px]:hidden">Mi perfil</span>
        </a>
    </aside>

    <!-- CONTENIDO -->
    <div class="min-h-screen bg-gradient-to-b from-hue from-70% to-[#d9edfa] pl-[76px] max-[640px]:pb-[110px] max-[640px]:pl-0">
        <main id="moduloRegistro" class="mx-auto w-full max-w-[1040px] px-5 pb-12 pt-8">

            <!-- título -->
            <div class="w-fit">
                <h1 class="font-display text-[clamp(22px,3vw,26px)] font-bold leading-none text-azuoscuro">Registro</h1>
                <div class="mt-2 h-[5px] w-full rounded-full bg-gradient-to-r from-aguama to-azu"></div>
            </div>
            <p class="mt-2 text-[14.5px] text-sua">Entradas y salidas escaneadas del colegio.</p>

            <!-- período + fecha -->
            <div class="mt-5 flex flex-wrap items-center justify-between gap-2 rounded-[26px] border border-borde bg-white p-1.5 shadow-[0_6px_18px_rgba(22,50,79,0.08)]">
                <nav aria-label="Período" class="flex gap-1">
                    <button type="button" data-periodo="dia"
                        class="activa whitespace-nowrap rounded-full px-5 py-2 text-[14.5px] font-semibold text-sua transition hover:bg-hue hover:text-azuoscuro [&.activa]:bg-gradient-to-br [&.activa]:from-aguama [&.activa]:to-azu [&.activa]:text-white [&.activa]:shadow-[0_6px_14px_-6px_rgba(31,111,178,.6)] [&.activa]:hover:text-white">Día</button>
                    <button type="button" data-periodo="semana"
                        class="whitespace-nowrap rounded-full px-5 py-2 text-[14.5px] font-semibold text-sua transition hover:bg-hue hover:text-azuoscuro [&.activa]:bg-gradient-to-br [&.activa]:from-aguama [&.activa]:to-azu [&.activa]:text-white [&.activa]:shadow-[0_6px_14px_-6px_rgba(31,111,178,.6)] [&.activa]:hover:text-white">Semana</button>
                    <button type="button" data-periodo="mes"
                        class="whitespace-nowrap rounded-full px-5 py-2 text-[14.5px] font-semibold text-sua transition hover:bg-hue hover:text-azuoscuro [&.activa]:bg-gradient-to-br [&.activa]:from-aguama [&.activa]:to-azu [&.activa]:text-white [&.activa]:shadow-[0_6px_14px_-6px_rgba(31,111,178,.6)] [&.activa]:hover:text-white">Mes</button>
                </nav>

                <label for="fechaRef" class="flex items-center gap-2 rounded-full px-4 py-1.5 text-sm font-semibold text-sua">
                    <i class="fa-regular fa-calendar text-aguama"></i>
                    <span class="max-[480px]:hidden">Fecha</span>
                    <input type="date" id="fechaRef"
                        class="h-9 rounded-lg border border-borde bg-hue px-2.5 text-sm font-medium text-azuoscuro outline-none transition focus:border-azu">
                </label>
            </div>

            <p id="rangoTexto" class="mt-3 flex items-center gap-2 px-1 text-[14px] font-medium text-azuoscuro">
                <i class="fa-solid fa-clock-rotate-left text-aguama"></i><span></span></p>

            <!-- resumen -->
            <div class="mt-4 grid grid-cols-3 gap-3 max-[560px]:grid-cols-1">
                <div class="flex items-center gap-3 rounded-[18px] border border-borde bg-white p-4 shadow-[0_6px_18px_rgba(22,50,79,0.08)]">
                    <span class="grid size-[42px] shrink-0 place-items-center rounded-[12px] bg-hue text-[18px] text-azu"><i class="fa-solid fa-barcode"></i></span>
                    <div><p id="statEscaneos" class="font-display text-[22px] font-extrabold leading-none text-azuoscuro">0</p>
                        <p class="mt-1 text-[12.5px] text-sua">Escaneos</p></div>
                </div>
                <div class="flex items-center gap-3 rounded-[18px] border border-borde bg-white p-4 shadow-[0_6px_18px_rgba(22,50,79,0.08)]">
                    <span class="grid size-[42px] shrink-0 place-items-center rounded-[12px] bg-hue text-[18px] text-aguama"><i class="fa-solid fa-user-graduate"></i></span>
                    <div><p id="statEstudiantes" class="font-display text-[22px] font-extrabold leading-none text-azuoscuro">0</p>
                        <p class="mt-1 text-[12.5px] text-sua">Estudiantes</p></div>
                </div>
                <div class="flex items-center gap-3 rounded-[18px] border border-borde bg-white p-4 shadow-[0_6px_18px_rgba(22,50,79,0.08)]">
                    <span class="grid size-[42px] shrink-0 place-items-center rounded-[12px] bg-hue text-[18px] text-orro"><i class="fa-solid fa-arrow-right-from-bracket"></i></span>
                    <div><p id="statFuera" class="font-display text-[22px] font-extrabold leading-none text-azuoscuro">0</p>
                        <p class="mt-1 text-[12.5px] text-sua">No han vuelto (hoy)</p></div>
                </div>
            </div>

            <!-- búsqueda + filtros -->
            <div class="mt-5 flex items-center justify-between gap-3">
                <label for="buscarRegistro"
                    class="flex h-[42px] w-[300px] items-center gap-2.5 rounded-full border border-borde bg-white px-4 text-sua shadow-[0_4px_12px_rgba(22,50,79,0.06)] focus-within:border-azu max-[640px]:flex-1">
                    <i class="fa-solid fa-magnifying-glass text-sm text-azu"></i>
                    <input id="buscarRegistro" type="search" placeholder="Nombre, apellido o código..."
                        class="h-full w-full bg-transparent text-sm text-text outline-none placeholder:text-sua/60">
                </label>

                <div class="relative">
                    <button type="button" id="btnFiltrosReg" aria-haspopup="true" aria-expanded="false"
                        class="flex h-[42px] items-center gap-2.5 rounded-full border border-borde bg-white px-4 text-sm font-medium text-azuoscuro shadow-[0_4px_12px_rgba(22,50,79,0.06)] transition-colors hover:border-azu">
                        <i class="fa-solid fa-sliders text-aguama"></i>Filtros
                        <i id="flechaFiltrosReg" class="fa-solid fa-chevron-down text-[11px] text-sua transition-transform duration-200"></i>
                    </button>

                    <div id="panelFiltrosReg" hidden
                        class="absolute right-0 top-[calc(100%+10px)] z-40 max-h-[70vh] w-[340px] max-w-[calc(100vw-40px)] overflow-y-auto rounded-[18px] border border-borde bg-white p-4 text-left shadow-[0_20px_50px_rgba(22,50,79,0.18)]">
                        <div class="mb-3 flex items-center justify-between">
                            <p class="font-display text-[15px] font-bold text-azuoscuro">Filtrar por</p>
                            <button type="button" id="limpiarFiltrosReg" class="text-[13px] font-semibold text-azu hover:underline">Limpiar</button>
                        </div>

                        <p class="mb-1.5 text-[11px] font-semibold uppercase tracking-wider text-aguama">Grado</p>
                        <div id="chipsGradoReg" data-clave="grado" class="mb-4 grid grid-cols-4 gap-1.5"></div>

                        <p class="mb-1.5 text-[11px] font-semibold uppercase tracking-wider text-aguama">Última acción</p>
                        <div id="chipsEstadoReg" data-clave="estado" class="flex flex-wrap gap-1.5"></div>
                    </div>
                </div>
            </div>

            <!-- lista -->
            <div class="mt-5 flex items-center gap-2">
                <span class="inline-flex items-center gap-1.5 rounded-full bg-aguama/10 px-3 py-1 text-[12px] font-semibold uppercase tracking-wider text-aguama">
                    <i class="fa-solid fa-barcode text-[10px]"></i>Escaneados</span>
                <span id="contadorLista" class="text-[13px] text-sua"></span>
            </div>

            <div id="listaRegistros" class="mt-3 grid grid-cols-2 gap-4 text-left max-[760px]:grid-cols-1"></div>
            <p id="sinRegistros" class="mt-8 hidden text-center text-sua">No hay escaneos para este período.</p>
        </main>
    </div>

    <script src="../js/admin/registro.js"></script>
</body>

</html>
